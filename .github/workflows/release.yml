name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Require committed lockfile
        run: test -f Cargo.lock
      - name: Preflight
        run: ./scripts/release-preflight.sh --skip-rust
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --locked
      - name: Build
        run: cargo build --release --workspace --locked
      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/bin-stage/niri-pip-linux-x86_64/bin
          BUNDLE=dist/bin-stage/niri-pip-linux-x86_64

          cp target/release/niripip target/release/niripipd "$BUNDLE/bin/"
          cp install.sh uninstall.sh README.md README.ru.md LICENSE CHANGELOG.md VERIFICATION.md "$BUNDLE/"
          cp -r config systemd integrations docs packaging "$BUNDLE/"
          mkdir -p "$BUNDLE/scripts"
          cp scripts/setup-niri-integration.sh scripts/remove-niri-integration.sh "$BUNDLE/scripts/"

          tar -C dist/bin-stage -czf dist/niri-pip-linux-x86_64.tar.gz niri-pip-linux-x86_64
          (cd dist && sha256sum niri-pip-linux-x86_64.tar.gz > niri-pip-linux-x86_64.tar.gz.sha256)

          mkdir -p "dist/source-stage/niri-pip-${VERSION}"
          git ls-files -z | tar --null -T - -cf - | tar -C "dist/source-stage/niri-pip-${VERSION}" -xf -
          cp Cargo.lock "dist/source-stage/niri-pip-${VERSION}/Cargo.lock"
          tar -C dist/source-stage -czf "dist/niri-pip-v${VERSION}-source.tar.gz" "niri-pip-${VERSION}"
          (cd dist && sha256sum "niri-pip-v${VERSION}-source.tar.gz" > "niri-pip-v${VERSION}-source.tar.gz.sha256")

          (cd dist && sha256sum niri-pip-linux-x86_64.tar.gz niri-pip-v${VERSION}-source.tar.gz > SHA256SUMS)
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/niri-pip-linux-x86_64.tar.gz
            dist/niri-pip-linux-x86_64.tar.gz.sha256
            dist/niri-pip-v${{ env.VERSION }}-source.tar.gz
            dist/niri-pip-v${{ env.VERSION }}-source.tar.gz.sha256
            dist/SHA256SUMS
